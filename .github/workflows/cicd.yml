name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci-build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. بناء الصورة محلياً للفحص أولاً (بدون Push)
      - name: Build Docker Image Locally for Scan
        uses: docker/build-push-action@v5
        with:
          context: ./Skills_Utilization
          file: ./Skills_Utilization/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test

      # 2. فحص الثغرات الأمنية باستخدام Trivy
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test'
          format: 'table'
          exit-code: '1' # يوقف الـ Pipeline إذا تم اكتشاف ثغرات خطيرة
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 3. رفع الصورة إلى GHCR فقط بعد نجاح الفحص
      - name: Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Skills_Utilization
          file: ./Skills_Utilization/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  cd-deploy:
    needs: ci-build
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Services with Docker Compose
        run: |
          docker compose down
          docker compose pull
          docker compose up -d
